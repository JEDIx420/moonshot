[workspace]
members = [
    "crates/moonshot-core",
    "crates/moonshot-oracle",
    "crates/moonshot-model",
    "crates/moonshot-editor",
    "crates/moonshot-runner",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
sha2 = "0.10.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
