[package]
name = "moonshot-runner"
version = "0.1.0"
edition = "2021"
description = "Moonshot CLI: smoke tests, baseline comparisons, meta-training loops, and multi-seed evaluations"

[[bin]]
name = "moonshot"
path = "src/main.rs"

[[bin]]
name = "lab"
path = "src/bin/lab.rs"

[[bin]]
name = "cycle6-verify"
path = "src/bin/cycle6_verify.rs"


[dependencies]
moonshot-core = { path = "../moonshot-core" }
moonshot-model = { path = "../moonshot-model" }
moonshot-oracle = { path = "../moonshot-oracle" }
moonshot-editor = { path = "../moonshot-editor" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rand.workspace = true
rand_chacha.workspace = true
burn = { version = "=0.22.1", default-features = false, features = ["std", "optim"], optional = true }
sha2.workspace = true
safetensors = { version = "0.3.3", optional = true }

[features]
cuda = ["dep:burn", "burn/cuda", "burn/flex", "dep:safetensors"]
cycle5-forward-test = ["dep:burn", "burn/ndarray"]
